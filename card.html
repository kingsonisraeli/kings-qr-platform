<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Business Card</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.foot{text-align:center;color:#9aa3b2;font-size:14px;padding:8px 16px 28px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style id="cs"></style>
</head><body>
<div class="card" id="card"><p style="color:#9aa3b2">Loading…</p></div>
<div class="foot">Powered by Kings &amp; Son's Digital Solutions</div>
<script>
document.getElementById('cs').textContent = CARD_CSS;
(async () => {
  const q = new URLSearchParams(location.search);
  const slug = q.get('b') || location.hash.slice(1);
  const root = document.getElementById('card');
  if (!slug) { root.innerHTML = '<p>Invalid link.</p>'; return; }
  const { data, error } = await sb.rpc('get_card', { p_slug: slug });
  if (error || !data) { root.innerHTML = '<p style="color:#9aa3b2">This card is not available.</p>'; return; }
  document.title = data.name;
  renderCard(root, data);
})();
</script>
</body></html>
